{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dutchpal-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: dutchpal-ui
    app.kubernetes.io/component: ui
    {{- include "dutchpal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  revisionHistoryLimit: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dutchpal-ui
  template:
    metadata:
      labels:
        app: dutchpal-ui
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: dutchpal-ui
          image: {{ include "dutchpal.image" (dict "Values" .Values "imageName" .Values.ui.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dutchpal-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: dutchpal-ui
spec:
  selector:
    app: dutchpal-ui
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: {{ .Values.ui.port }}
{{- end }}
