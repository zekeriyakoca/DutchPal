{{- if .Values.coreApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dutchpal-core-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: dutchpal-core-api
    app.kubernetes.io/component: core-api
    {{- include "dutchpal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coreApi.replicas }}
  revisionHistoryLimit: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dutchpal-core-api
  template:
    metadata:
      labels:
        app: dutchpal-core-api
        app.kubernetes.io/component: core-api
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: dutchpal-core-api
          image: {{ include "dutchpal.image" (dict "Values" .Values "imageName" .Values.coreApi.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.coreApi.port }}
          envFrom:
            - configMapRef:
                name: dutchpal-config
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          env:
            - name: OTEL_SERVICE_NAME
              value: dutchpal-core-api
            {{- if and .Values.otel.enabled .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            - name: ConnectionStrings__DefaultConnection
              value: "Host=dutchpal-postgres;Port={{ .Values.postgres.port }};Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
          resources:
            {{- toYaml .Values.coreApi.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.coreApi.port }}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.coreApi.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.coreApi.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dutchpal-core-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: dutchpal-core-api
spec:
  selector:
    app: dutchpal-core-api
  ports:
    - name: http
      port: {{ .Values.coreApi.port }}
      targetPort: {{ .Values.coreApi.port }}
{{- end }}
